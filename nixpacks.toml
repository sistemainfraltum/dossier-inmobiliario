[phases.setup]
aptPkgs = [
  "libpango-1.0-0",
  "libpangocairo-1.0-0",
  "libcairo2",
  "libgdk-pixbuf2.0-0",
  "libglib2.0-0",
  "libffi-dev",
  "libxml2",
  "libxslt1.1",
  "shared-mime-info",
  "fonts-liberation",
  "fonts-dejavu-core",
]

[phases.install]
cmds = [
  "pip install --upgrade pip",
  "pip install -r requirements.txt",
]

[start]
cmd = "gunicorn app:app --bind 0.0.0.0:$PORT"
